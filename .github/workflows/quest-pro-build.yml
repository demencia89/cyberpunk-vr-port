name: Quest Pro Windows build

on:
  push:
    branches: [build/quest-pro-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out Quest Pro source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check out public game 2.5 SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: wopss/RED4ext.SDK
          ref: a34f0ad0a9e4f37cbe1fe001e4ff68c2949d0665
          path: sdk-game25
          submodules: recursive
          persist-credentials: false
      - name: Configure full plugin
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCVR_RED4EXT_SDK_DIR=$env:GITHUB_WORKSPACE/sdk-game25"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and run launcher tests
        run: |
          cmake -S tools/launcher_tests -B build/launcher-tests -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/launcher-tests --config Release --target launcher_tests --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/launcher-tests -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build full plugin
        run: |
          cmake --build build --config Release --target cyberpunkvrport_stereo --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Record artifact identity
        run: |
          $dll = "build/bin/red4ext/plugins/cyberpunkvrport/Release/cyberpunkvrport.dll"
          if (!(Test-Path $dll)) { throw "Plugin DLL was not built" }
          $record = @{
            source_commit = "$env:GITHUB_SHA"
            quest_pro_commit = "04e85afc51e1cca794d36f4f38755518069593b8"
            sdk_repository = "wopss/RED4ext.SDK"
            sdk_commit = "a34f0ad0a9e4f37cbe1fe001e4ff68c2949d0665"
            dll_sha256 = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
            launcher_tests = "passed"
          }
          $record | ConvertTo-Json | Set-Content build/quest-pro-build.json
      - name: Upload plugin and symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quest-pro-plugin
          if-no-files-found: error
          retention-days: 14
          path: |
            build/bin/red4ext/plugins/cyberpunkvrport/Release/cyberpunkvrport.dll
            build/bin/red4ext/plugins/cyberpunkvrport/Release/cyberpunkvrport.pdb
            build/quest-pro-build.json
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quest-pro-build-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/launcher-tests/Testing/Temporary/LastTest.log
